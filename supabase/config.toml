project_id = "harbourline"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = ["http://localhost:4173", "http://127.0.0.1:4173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[realtime]
enabled = true

[functions.delete-account]
verify_jwt = true

[functions.create-checkout-session]
verify_jwt = true

[functions.create-billing-portal]
verify_jwt = true

[functions.reconcile-billing-subscription]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

[functions.record-beta-progress]
verify_jwt = true

[functions.get-beta-operations]
verify_jwt = true

[functions.harbourline-api]
verify_jwt = false

[functions.google-calendar-start]
verify_jwt = true

[functions.google-calendar-callback]
verify_jwt = false

[functions.google-calendar-status]
verify_jwt = true

[functions.google-calendar-sync]
verify_jwt = true

[functions.google-calendar-disconnect]
verify_jwt = true
