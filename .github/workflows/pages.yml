name: Deploy product homepage

on:
  push:
    branches:
      - main
    paths:
      - "marketing/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Verify marketing SEO artifacts
        run: node scripts/verify-marketing-seo.mjs

      - name: Prepare homepage artifact
        run: |
          mkdir -p _site/assets
          cp -R marketing/. _site/
          cp assets/harbourline-mark.svg _site/assets/
          cp assets/favicon.svg _site/assets/
          cp assets/harbourline-waterfront.jpg _site/assets/

      - name: Upload homepage
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
