name: Harbourline CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/record-beta-progress/index.ts
      - run: deno check supabase/functions/get-beta-operations/index.ts
      - run: deno test supabase/functions/_shared/beta.test.ts
      - name: Verify staging deployment fixture
        env:
          VITE_HARBOURLINE_DEPLOYMENT: staging
          VITE_SUPABASE_URL: https://staging.example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture
          VITE_HARBOURLINE_SUPPORT_EMAIL: support@example.com
        run: pnpm deploy:verify
      - run: pnpm check
