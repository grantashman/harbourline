name: Deploy Supabase production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Confirm backup, approvals, and release-gate evidence are complete"
        required: true
        type: boolean
        default: false
      expected_sha:
        description: "Exact reviewed main-branch commit to deploy"
        required: true
        type: string
      release_evidence_ref:
        description: "Non-secret ticket or document reference for release evidence"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Apply migrations and deploy Edge Functions
    if: inputs.confirm_production == true && github.ref == 'refs/heads/main' && inputs.expected_sha == github.sha
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      STRIPE_PRICE_ID: ${{ vars.STRIPE_PRICE_ID }}
      STRIPE_PRODUCT_ID: ${{ vars.STRIPE_PRODUCT_ID }}
      STRIPE_BILLING_CURRENCY: aud
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      - name: Verify reviewed commit and release evidence reference
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_EVIDENCE_REF: ${{ inputs.release_evidence_ref }}
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test -n "$RELEASE_EVIDENCE_REF"
          git diff --exit-code

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply production migrations
        run: supabase db push --linked

      - name: Configure reviewed Stripe contract
        run: |
          test -n "$STRIPE_PRICE_ID"
          test "$STRIPE_PRICE_ID" = "price_1U2AOcBha937Q1NNu8HrnIRJ"
          test -n "$STRIPE_PRODUCT_ID"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --yes "STRIPE_PRICE_ID=$STRIPE_PRICE_ID"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --yes "STRIPE_PRODUCT_ID=$STRIPE_PRODUCT_ID"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --yes "STRIPE_BILLING_CURRENCY=$STRIPE_BILLING_CURRENCY"

      - name: Deploy all Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify production schema and function deployment
        run: |
          supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" | grep -E 'STRIPE_(SECRET_KEY|PRICE_ID|PRODUCT_ID|BILLING_CURRENCY)'
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" | grep -F 'create-checkout-session'
          supabase db query --linked --output json "select case when exists (select 1 from public.currency_catalog where code = 'AUD' and enabled = true) then 1 else 1/0 end as aud_ok, case when exists (select 1 from pg_proc where oid = 'public.sync_budget(uuid,uuid,bigint,integer,text,text)'::regprocedure) then 1 else 1/0 end as sync_ok"
