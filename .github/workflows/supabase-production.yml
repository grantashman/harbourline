name: Deploy Supabase production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Apply migrations and deploy Edge Functions
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      STRIPE_PRICE_ID: ${{ vars.STRIPE_PRICE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Set live Stripe price
        run: |
          test -n "$STRIPE_PRICE_ID"
          test "$STRIPE_PRICE_ID" = "price_1U2AOcBha937Q1NNu8HrnIRJ"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --yes "STRIPE_PRICE_ID=$STRIPE_PRICE_ID"

      - name: Apply production migrations
        run: supabase db push --linked

      - name: Deploy all Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
