name: Deploy Supabase production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Optional exact main commit to redeploy"
        required: false
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply migrations and deploy Edge Functions
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.expected_sha == '' || inputs.expected_sha == github.sha)
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      STRIPE_PRICE_ID: ${{ vars.STRIPE_PRICE_ID }}
      STRIPE_PRODUCT_ID: ${{ vars.STRIPE_PRODUCT_ID }}
      STRIPE_BILLING_CURRENCY: aud
      STRIPE_LIVE_MODE: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      - name: Verify exact merged main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$GITHUB_SHA"
          pulls="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --header 'Accept: application/vnd.github+json')"
          jq -e --arg sha "$GITHUB_SHA" \
            'any(.[]; .base.ref == "main" and .merge_commit_sha == $sha and .merged_at != null)' \
            <<<"$pulls" >/dev/null

      - name: Wait for exact main quality gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required=("validate" "CodeQL JavaScript and TypeScript")
          for attempt in $(seq 1 60); do
            checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" --header 'Accept: application/vnd.github+json')"
            failed=0
            pending=0
            for required_check in "${required[@]}"; do
              conclusion="$(jq -r --arg name "$required_check" --arg sha "$GITHUB_SHA" \
                '[.check_runs[] | select(.name == $name and .head_sha == $sha) | .conclusion] | last // ""' \
                <<<"$checks")"
              case "$conclusion" in
                success) ;;
                failure|cancelled|timed_out|action_required|stale)
                  echo "Required check failed: $required_check ($conclusion)"
                  failed=1
                  ;;
                *)
                  pending=1
                  ;;
              esac
            done
            test "$failed" -eq 0 || exit 1
            if test "$pending" -eq 0; then
              echo "Main quality gates passed for $GITHUB_SHA"
              break
            fi
            test "$attempt" -lt 60 || { echo "Timed out waiting for main quality gates"; exit 1; }
            sleep 10
          done

      - name: Verify production configuration before migration
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$STRIPE_PRICE_ID"
          test "$STRIPE_PRICE_ID" = "price_1U2AOcBha937Q1NNu8HrnIRJ"
          test -n "$STRIPE_PRODUCT_ID"
          [[ "$STRIPE_PRODUCT_ID" =~ ^prod_[A-Za-z0-9]+$ ]]
          test "$STRIPE_BILLING_CURRENCY" = "aud"
          test "$STRIPE_LIVE_MODE" = "true"
          git diff --exit-code

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply production migrations
        run: supabase db push --linked

      - name: Configure reviewed Stripe contract
        run: |
          set -euo pipefail
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --yes "STRIPE_PRICE_ID=$STRIPE_PRICE_ID"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --yes "STRIPE_PRODUCT_ID=$STRIPE_PRODUCT_ID"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --yes "STRIPE_BILLING_CURRENCY=$STRIPE_BILLING_CURRENCY"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --yes "STRIPE_LIVE_MODE=$STRIPE_LIVE_MODE"

      - name: Deploy all Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify production schema and function deployment
        run: |
          set -euo pipefail
          secret_names="$(supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" --output json | jq -r '.[].name')"
          for required_secret in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRICE_ID STRIPE_PRODUCT_ID STRIPE_BILLING_CURRENCY STRIPE_LIVE_MODE; do
            grep -Fx "$required_secret" <<<"$secret_names" >/dev/null
          done
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" | grep -F 'create-checkout-session'
          supabase db query --linked --output json "select case when exists (select 1 from public.currency_catalog where code = 'AUD' and enabled = true) then 1 else 1/0 end as aud_ok, case when not exists (select 1 from public.currency_catalog where code <> 'AUD' and enabled = true) then 1 else 1/0 end as aud_only_ok, case when exists (select 1 from pg_proc where oid = 'public.sync_budget(uuid,uuid,bigint,integer,text,text)'::regprocedure) then 1 else 1/0 end as sync_ok"
